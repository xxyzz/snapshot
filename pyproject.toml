[build-system]
requires = ["flit_core"]
build-backend = "flit_core.buildapi"

[project]
name = "snapshot"
version = "0.1.0"
authors = [{ name = "xxyzz" }]
description = "Parsoid snapshot chunks"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "requests",
    "libzim",
    "lxml",
    "mariadb[binary]==2.0.0rc2",
]

[project.scripts]
sp = "snapshot.main:main"

[tool.typos]
type.json.check-file = false
default.extend-words = {"tha" = "tha"}

[tool.uv.audit]
malware-check = true
