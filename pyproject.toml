[build-system]
requires = ["setuptools", "setuptools-scm[simple]"]
build-backend = "setuptools.build_meta"

[project]
name = "sp"
version = "0.1.0"
authors = [{ name = "xxyzz" }]
description = "Parsoid snapshot chunks"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "requests",
    "libzim",
    "lxml",
    "mariadb[binary]==2.0.0rc2",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
sp = "snapshot.main:main"

[tool.ruff.lint]
select = [
    "E", # pycodestyle error
    "F", # Pyflakes
    "I", # isort
    "W", # pycodestyle warning
]

[tool.typos]
type.json.check-file = false
default.extend-words = {"tha" = "tha"}
