name: snapshot

on:
  workflow_run:
    workflows: [check]
    types:
      - completed
    branches:
      - master

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TELEMETRY: false

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      need_update: ${{ steps.check-result.outputs.need_update }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: check-result
        run: echo "need_update=$(cat build/check_result)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.need_update == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        edition:
          - 'en'
          - 'es'
          - 'fr'
          - 'ru'
          - 'de'
          - 'zh'
          - 'ja'
          - 'pl'
          - 'el'
          - 'nl'
          - 'th'
          - 'fi'
          - 'sv'
          - 'simple'
          - 'it'
          - 'pt'
          - 'vi'
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: actions/download-artifact@v8
        with:
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Get tag
        id: get-tag
        run: echo "tag=$(cat build/tag)" >> "$GITHUB_OUTPUT"

      - if: matrix.edition == 'en'
        run: gh release create ${{ steps.get-tag.outputs.tag }} -d

      - run: python -m pip install .
      - run: snap build ${{ matrix.edition }}
        env:
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}

      - run: |
          rm build/info.json
          gh release upload ${{ steps.get-tag.outputs.tag }} build/*.json build/*.zst
      - if: contains(fromJSON('["fr", "de", "fi", "nl", "it"]'), matrix.edition)
        run: gh release upload ${{ steps.get-tag.outputs.tag }} build/*.zim

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: gh release edit ${{ needs.build.outputs.tag }} --draft=false --latest
